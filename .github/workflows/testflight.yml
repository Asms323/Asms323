name: Pocket AI → TestFlight

# Builds the iOS app on a GitHub-hosted Mac and uploads it to TestFlight.
# Run it from the GitHub app/website: Actions tab → "Pocket AI → TestFlight" → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["PocketAI/**", ".github/workflows/testflight.yml"]

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PocketAI
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check configuration
        run: |
          missing=0
          for v in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see PocketAI/README.md)"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::ASC_KEY_P8 secret is not set"; missing=1; fi
          exit $missing

      - name: Install App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PocketAI.xcodeproj \
            -scheme PocketAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketAI.xcarchive" \
            -allowProvisioningUpdates \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*signing|ARCHIVE" || true
          test -d "$RUNNER_TEMP/PocketAI.xcarchive" || { tail -100 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export & upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PocketAI.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/*.log

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
