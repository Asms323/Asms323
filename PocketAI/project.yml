# XcodeGen spec — generates PocketAI.xcodeproj.
#   brew install xcodegen && cd PocketAI && xcodegen generate
name: PocketAI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""          # set yours, or pass DEVELOPMENT_TEAM=... to xcodebuild
    CODE_SIGN_STYLE: Automatic

packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.25.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: "3.32.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  PocketAI:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    entitlements:
      path: Resources/PocketAI.entitlements
      properties:
        # Lets the app use more RAM on devices that have it (needed for LLMs).
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocket AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - metal
        # No custom encryption -> skips the export-compliance question in TestFlight.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketai
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
