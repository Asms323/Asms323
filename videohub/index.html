<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Hub</title>
<meta name="description" content="A home-screen launcher for YouTube on the web, with saved videos.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Video Hub">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --text: #15171c;
    --muted: #646b78;
    --accent: #e8483b;
    --accent-text: #ffffff;
    --border: #dcdfe5;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111318;
      --surface: #1b1e25;
      --surface-2: #262a33;
      --text: #eef0f4;
      --muted: #9aa1ae;
      --accent: #ff5a4c;
      --accent-text: #ffffff;
      --border: #2e333d;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111318; --surface: #1b1e25; --surface-2: #262a33; --text: #eef0f4;
    --muted: #9aa1ae; --accent: #ff5a4c; --accent-text: #fff; --border: #2e333d; --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 0 16px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 4px 10px; font-weight: 600; }

  form.search { display: flex; gap: 8px; }
  input[type="search"], input[type="url"] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 17px;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button, .btn {
    font: inherit; font-weight: 600;
    border: 0; border-radius: 12px;
    padding: 13px 16px;
    background: var(--accent); color: var(--accent-text);
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  button.ghost { background: var(--surface-2); color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    border-radius: 14px; padding: 14px; color: var(--text); text-decoration: none;
    display: flex; flex-direction: column; gap: 6px; min-height: 84px;
  }
  .tile .ico { font-size: 22px; }
  .tile b { font-size: 15px; }
  .tile span { font-size: 13px; color: var(--muted); }

  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .video {
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    border-radius: 14px; overflow: hidden; position: relative;
  }
  .video button.play { all: unset; cursor: pointer; display: block; width: 100%; }
  .video img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface-2); }
  .video .meta { padding: 10px 12px 12px; padding-right: 44px; }
  .video .title { font-weight: 600; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video .author { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .video .del {
    position: absolute; right: 8px; bottom: 10px;
    width: 32px; height: 32px; padding: 0; border-radius: 50%;
    background: var(--surface-2); color: var(--muted); font-size: 16px;
  }
  .empty { color: var(--muted); padding: 18px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 4px 0; }
  .err { color: var(--accent); font-size: 14px; margin: 8px 4px 0; min-height: 1em; }

  /* Player sheet */
  .player {
    position: fixed; inset: 0; background: rgba(0,0,0,.92);
    display: none; flex-direction: column; z-index: 10;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .player.open { display: flex; }
  .player .bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; gap: 10px; }
  .player .bar .t { color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .frame { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 0 16px; }
  .player iframe { width: 100%; max-width: 1100px; aspect-ratio: 16/9; border: 0; background: #000; }
  .player .bar button { background: #2a2d34; color: #fff; padding: 10px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="">
    <h1>Video Hub</h1>
  </header>

  <form class="search" id="searchForm" role="search">
    <input type="search" id="q" placeholder="Search YouTube" enterkeyhint="search" autocomplete="off" aria-label="Search YouTube">
    <button type="submit" aria-label="Search">Search</button>
  </form>

  <h2>Open</h2>
  <div class="grid">
    <a class="tile" href="https://m.youtube.com/"><span class="ico">▶︎</span><b>YouTube</b><span>Home feed</span></a>
    <a class="tile" href="https://m.youtube.com/feed/subscriptions"><span class="ico">📺</span><b>Subscriptions</b><span>Your channels</span></a>
    <a class="tile" href="https://m.youtube.com/feed/library"><span class="ico">📚</span><b>Library</b><span>Playlists &amp; history</span></a>
    <a class="tile" href="https://music.youtube.com/"><span class="ico">🎵</span><b>YouTube Music</b><span>Music &amp; podcasts</span></a>
  </div>

  <h2>Saved videos</h2>
  <form class="search" id="addForm">
    <input type="text" id="link" placeholder="Paste a YouTube link" inputmode="url" autocomplete="off" aria-label="YouTube link">
    <button type="submit" class="ghost">Save</button>
  </form>
  <div class="err" id="err"></div>
  <div class="videos" id="videos"></div>
  <p class="note">Saved videos are stored only on this device. Please don't watch while driving.</p>
</div>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="bar">
    <span class="t" id="playerTitle"></span>
    <span style="display:flex;gap:8px">
      <button type="button" id="openYt">Open on YouTube</button>
      <button type="button" id="closePlayer">Close</button>
    </span>
  </div>
  <div class="frame" id="frame"></div>
</div>

<script>
(() => {
  const KEY = 'videohub.saved.v1';
  const $ = (id) => document.getElementById(id);

  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  };
  const store = (list) => {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {}
  };
  let saved = load();

  // Accepts watch?v=, youtu.be/, shorts/, embed/, live/ links or a bare 11-char ID.
  function videoId(input) {
    const s = input.trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    let url;
    try { url = new URL(s.startsWith('http') ? s : 'https://' + s); } catch { return null; }
    const host = url.hostname.replace(/^www\.|^m\./, '');
    if (host === 'youtu.be') return url.pathname.slice(1, 12) || null;
    if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
      const v = url.searchParams.get('v');
      if (v) return v.slice(0, 11);
      const m = url.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/);
      if (m) return m[1];
    }
    return null;
  }

  async function fetchInfo(id) {
    try {
      const r = await fetch('https://www.youtube.com/oembed?format=json&url=' +
        encodeURIComponent('https://www.youtube.com/watch?v=' + id));
      if (!r.ok) throw 0;
      const j = await r.json();
      return { title: j.title, author: j.author_name };
    } catch {
      return { title: 'YouTube video', author: '' };
    }
  }

  function render() {
    const box = $('videos');
    box.innerHTML = '';
    if (!saved.length) {
      box.innerHTML = '<div class="empty">No saved videos yet. Paste a YouTube link above to save one.</div>';
      return;
    }
    for (const v of saved) {
      const card = document.createElement('div');
      card.className = 'video';

      const play = document.createElement('button');
      play.className = 'play';
      play.type = 'button';
      play.setAttribute('aria-label', 'Play ' + v.title);
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = '';
      img.src = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
      const meta = document.createElement('div');
      meta.className = 'meta';
      const t = document.createElement('div'); t.className = 'title'; t.textContent = v.title;
      const a = document.createElement('div'); a.className = 'author'; a.textContent = v.author || '';
      meta.append(t, a);
      play.append(img, meta);
      play.addEventListener('click', () => openPlayer(v));

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Remove ' + v.title);
      del.addEventListener('click', () => {
        saved = saved.filter((x) => x.id !== v.id);
        store(saved); render();
      });

      card.append(play, del);
      box.append(card);
    }
  }

  let current = null;
  function openPlayer(v) {
    current = v;
    $('playerTitle').textContent = v.title;
    const f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1&playsinline=1&rel=0';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = v.title;
    $('frame').replaceChildren(f);
    $('player').classList.add('open');
  }
  function closePlayer() {
    $('frame').replaceChildren();
    $('player').classList.remove('open');
    current = null;
  }
  $('closePlayer').addEventListener('click', closePlayer);
  $('openYt').addEventListener('click', () => {
    if (current) location.href = 'https://m.youtube.com/watch?v=' + current.id;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayer(); });

  $('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('q').value.trim();
    location.href = q
      ? 'https://m.youtube.com/results?search_query=' + encodeURIComponent(q)
      : 'https://m.youtube.com/';
  });

  $('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = videoId($('link').value);
    $('err').textContent = '';
    if (!id) { $('err').textContent = "That doesn't look like a YouTube video link."; return; }
    if (saved.some((v) => v.id === id)) { $('err').textContent = 'Already saved.'; return; }
    const entry = { id, title: 'Loading…', author: '', added: Date.now() };
    saved.unshift(entry); render();
    $('link').value = '';
    Object.assign(entry, await fetchInfo(id));
    store(saved); render();
  });

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
